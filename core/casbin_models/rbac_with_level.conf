[request_definition]
r = sub, obj, act, level

[policy_definition]
p = sub, obj, act, level

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*") && matchLevel(r.level, p.level)
