[workspace]
resolver = "2"
members = [
    "core", "migration",
]

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
sea-orm = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tera = "1.19"
async-trait = "0.1"
bcrypt = "0.15"
chrono = "0.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9.3"
tower = { version = "0.4", features = ["util"] }
casbin = "2.3"
sea-orm-adapter = "0.4"
tempfile = "3.10"
rust-i18n = "3.0"
slug = "0.1"
toml = "0.8"
